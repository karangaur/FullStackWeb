<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Intro</title>
</head>

<body>
    <!-- Registration form -->
    <div class="registrationForm">
        <form action="">
            <h1>Sport Registration Form</h1>
            <ul type="square">
                <li>
                    <label for="name">Player Name:</label>
                    <input type="text" placeholder="Enter Full Name Here"> <br><br>
                </li>
                <li>
                    <label for="address">Address:</label><br>
                    <textarea name="address" id="address" cols="100" rows="3"></textarea> <br><br>
                </li>
                <li>
                    <label for="dob">Date of birth:</label>
                    <input type="date"><br><br>
                </li>
                <li>
                    <label for="gender">Gender:</label>

                    <input type="radio" name="gender">
                    <label for="male">Male</label>

                    <input type="radio" name="gender">
                    <label for="Female">Female</label><br><br>
                </li>
                <li>
                    <label for="name">Select your sport:</label>
                    <select name="sports" id="sports">
                        <option value="">--Choose your game--</option>
                        <option value="">Cricket</option>
                        <option value="">Badminton</option>
                        <option value="">Football</option>
                        <option value="">Chess</option>
                    </select>
                </li> <br>
                <li>
                    <label for="experience">Total Experience in your game:</label>
                    <input type="number" min="0" max="100">
                </li> <br>
                <li>
                    <label for="played">Have you ever played Internation?:</label>

                    <label for="">
                        <input type="checkbox" id="yes"> Yes
                    </label>

                    <label for="">
                        <input type="checkbox" id="no"> No
                    </label>

                </li><br>
                <li>
                    <input type="submit" value="Submit">
                </li>
            </ul>
        </form>
    </div>
    <a href="./GitHub.html">Visit GitHub</a>



</body>
</html>
